<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix It Felix Pro — Reverse Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="titlebar">
  <span id="titlebar-name">Fix It Felix Pro</span>
  <span id="titlebar-sub">Reverse Engineering — Phase 1: idea, technology, functions</span>
</header>

<div id="main">

  <!-- LEFT: the details list. Every documented item of the application. -->
  <aside id="sidebar">
    <div id="sidebar-head">
      <input id="filter" type="text" placeholder="Filter the list…" autocomplete="off">
    </div>
    <nav id="list"></nav>
  </aside>

  <!-- RIGHT: the page view of the selected item. -->
  <main id="page">
    <div id="page-head">
      <div id="page-kicker"></div>
      <h1 id="page-title"></h1>
      <p id="page-summary"></p>
    </div>
    <div id="page-body"></div>
    <div id="page-foot"></div>
  </main>

</div>

<!-- Full-screen diagram inspector (zoom + pan). -->
<div id="lightbox" hidden>
  <div id="lightbox-bar">
    <span id="lightbox-title"></span>
    <span id="lightbox-tools">
      <button data-act="out">&minus;</button>
      <button data-act="reset">100%</button>
      <button data-act="in">+</button>
      <button data-act="fit">Fit</button>
      <button data-act="close">Close</button>
    </span>
  </div>
  <div id="lightbox-viewport"><div id="lightbox-stage"></div></div>
</div>

<!-- One file per documented item, in display order. -->
<script src="data/overview.js"></script>
<script src="data/technology.js"></script>
<script src="data/architecture.js"></script>
<script src="data/environments.js"></script>
<script src="data/bootstrap.js"></script>

<script src="data/authentication.js"></script>
<script src="data/onboarding.js"></script>
<script src="data/subscription.js"></script>
<script src="data/account-lifecycle.js"></script>

<script src="data/jobs.js"></script>
<script src="data/quotes.js"></script>
<script src="data/invoices.js"></script>
<script src="data/customers.js"></script>
<script src="data/staff.js"></script>
<script src="data/pricing.js"></script>

<script src="data/tools.js"></script>
<script src="data/todos.js"></script>
<script src="data/journal.js"></script>
<script src="data/notifications.js"></script>

<script src="data/api.js"></script>
<script src="data/datamodel.js"></script>
<script src="data/routes.js"></script>

<script type="module" src="app.js"></script>

</body>
</html>
